<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · ASCII portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#fbfaf8; --card:#0b0b0c; --glyph:#ecebe6; --ghost:rgba(255,255,255,.075); }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--bg);font-family:Manrope,sans-serif}

  /* ===== ASCII portrait card (drop this block into the about page) ===== */
  .ascii-card{position:relative;width:100%;max-width:1200px;aspect-ratio:2.15/1;border-radius:16px;overflow:hidden;background:var(--card);color:#fff;isolation:isolate}
  .ascii-copy{position:absolute;left:9.5%;top:32%;z-index:3;max-width:240px}
  .ascii-copy .tag{margin:0 0 14px;font-weight:500;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.02em}
  .ascii-copy .lead{margin:0 0 10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
  .ascii-copy .sub{margin:0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.72)}

  /* faint binary + code lines that sit behind the portrait */
  .ascii-ghost{position:absolute;bottom:-4px;z-index:0;margin:0;font-weight:700;font-size:clamp(18px,2.3vw,28px);line-height:1.18;color:var(--ghost);white-space:pre;pointer-events:none;user-select:none}
  .ascii-ghost.l{left:9.5%}
  .ascii-ghost.r{right:3%}

  .ascii-stage{position:absolute;inset:0 0 0 auto;left:28%;right:12%;z-index:1;touch-action:pan-y}
  .ascii-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ascii-stage .photo{clip-path:inset(0 0 0 var(--split,100%))}

  /* compare handle: drag left to reveal the photo */
  .ascii-handle{position:absolute;top:50%;left:clamp(28px,var(--split,100%),calc(100% - 28px));z-index:4;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;border-radius:50%;
    background:#f4f3ef;color:#3a3a3a;display:grid;place-items:center;cursor:ew-resize;box-shadow:0 4px 18px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.16,1,.3,1)}
  .ascii-handle:hover{transform:scale(1.06)}
  .ascii-handle:active{transform:scale(.96)}
  .ascii-handle:focus-visible{outline:2px solid #fff;outline-offset:3px}
  .ascii-line{position:absolute;top:0;bottom:0;left:var(--split,100%);z-index:2;width:1px;background:rgba(255,255,255,.35);pointer-events:none}

  @media (max-width:767px){
    .ascii-card{aspect-ratio:auto;height:auto;padding:40px 24px 0;display:flex;flex-direction:column}
    .ascii-copy{position:relative;left:auto;top:auto;max-width:none}
    .ascii-ghost{display:none}
    .ascii-stage{position:relative;inset:auto;left:auto;right:auto;margin:28px -24px 0;aspect-ratio:1/1}
  }
</style>
</head>
<body>

<section class="ascii-card" aria-label="Portrait">
  <div class="ascii-copy">
    <p class="tag">// SYSTEMS</p>
    <p class="lead">Wrote code before I drew screens.</p>
    <p class="sub">So I design with the structure, logic and edge cases in mind.</p>
  </div>

  <!-- "Sidd" and "design" in binary -->
  <p class="ascii-ghost l" aria-hidden="true">01010011 01101001
01100100 01100100
systems.read()
people.first()</p>
  <p class="ascii-ghost r" aria-hidden="true">01100100 01100101
01110011 01101001
01100111 01101110
design.ship()</p>

  <div class="ascii-stage" id="stage">
    <canvas class="ascii" role="img" aria-label="Portrait of Siddhesha drawn in text characters"></canvas>
    <canvas class="photo" aria-hidden="true"></canvas>
  </div>
  <div class="ascii-line" aria-hidden="true"></div>
  <button class="ascii-handle" type="button" role="slider" aria-label="Compare text portrait with photo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 1 1 6l5 5M12 1l5 5-5 5"/></svg>
  </button>
</section>

<script>
(() => {
  const SRC = 'img/about/portrait-blue.webp';
  // crop of the source photo (1446 x 1087) that frames head and shoulders
  const CROP = { x: 320, y: 80, w: 800, h: 860 };
  const RAMP = ' .:-=+*#%@';            // dark to bright
  const BITS = '01';
  const BG = '#0b0b0c';

  const card = document.querySelector('.ascii-card');
  const stage = document.getElementById('stage');
  const asciiCv = stage.querySelector('.ascii');
  const photoCv = stage.querySelector('.photo');
  const handle = card.querySelector('.ascii-handle');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let img, grid = null, cols = 0, rows = 0, cw = 0, ch = 0, ox = 0, oy = 0, dpr = 1, fontPx = 8;
  let reveal = reduce ? 1 : 0, revealStart = 0, pointer = null, raf = 0;

  function fit() {
    // place the crop inside the stage like object-fit: contain, anchored to the bottom
    const r = stage.getBoundingClientRect();
    const s = Math.min(r.width / CROP.w, r.height / CROP.h);
    const w = CROP.w * s, h = CROP.h * s;
    return { W: r.width, H: r.height, w, h, x: (r.width - w) / 2, y: r.height - h };
  }

  function build() {
    const f = fit();
    dpr = Math.min(devicePixelRatio || 1, 2);
    for (const cv of [asciiCv, photoCv]) { cv.width = Math.round(f.W * dpr); cv.height = Math.round(f.H * dpr); }

    // cell size scales with the portrait so density stays similar at every width
    fontPx = Math.max(5.5, Math.min(9, f.h / 82));
    const ctx = asciiCv.getContext('2d');
    ctx.font = `500 ${fontPx}px "JetBrains Mono", ui-monospace, monospace`;
    cw = ctx.measureText('M').width; ch = fontPx * 1.02;
    cols = Math.floor(f.w / cw); rows = Math.floor(f.h / ch);
    ox = f.x + (f.w - cols * cw) / 2; oy = f.y + (f.h - rows * ch);

    // sample the photo down to one pixel per cell
    const s = document.createElement('canvas'); s.width = cols; s.height = rows;
    const sx = s.getContext('2d', { willReadFrequently: true });
    sx.imageSmoothingQuality = 'high';
    sx.drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, cols, rows);
    const px = sx.getImageData(0, 0, cols, rows).data;
    const lum = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) lum[i] = (0.2126 * px[i*4] + 0.7152 * px[i*4+1] + 0.0722 * px[i*4+2]) / 255;

    // stretch contrast using the subject only (ignore the black backdrop)
    const fg = Array.from(lum).filter(v => v > 0.04).sort((a, b) => a - b);
    const lo = fg[Math.floor(fg.length * 0.03)] || 0, hi = fg[Math.floor(fg.length * 0.985)] || 1;

    grid = new Float32Array(cols * rows);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const i = y * cols + x, v = lum[i];
      if (v < 0.035) { grid[i] = 0; continue; }
      // light edge boost keeps the eyes, brows and jaw readable
      const at = (xx, yy) => lum[Math.min(rows-1, Math.max(0, yy)) * cols + Math.min(cols-1, Math.max(0, xx))];
      const gx = at(x+1,y) - at(x-1,y), gy = at(x,y+1) - at(x,y-1);
      let n = (v - lo) / (hi - lo);
      n = Math.pow(Math.min(1, Math.max(0, n)), 1.35) + Math.hypot(gx, gy) * 0.9;
      grid[i] = Math.min(1, Math.max(0.08, n)); // hair and top stay faintly visible
    }

    // photo layer, with the black backdrop lifted to the card color so the seam disappears
    const p = photoCv.getContext('2d');
    p.setTransform(dpr, 0, 0, dpr, 0, 0);
    p.clearRect(0, 0, f.W, f.H);
    p.fillStyle = BG; p.fillRect(f.x, f.y, f.w, f.h);
    p.globalCompositeOperation = 'lighten';
    p.drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, f.x, f.y, f.w, f.h);
    p.globalCompositeOperation = 'source-over';

    draw();
  }

  function draw() {
    if (!grid) return;
    const ctx = asciiCv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, asciiCv.width, asciiCv.height);
    ctx.font = `500 ${fontPx}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ecebe6';

    const t = performance.now();
    const R = 70; // lens radius in px
    // bucket glyphs by brightness so fillStyle/alpha changes stay cheap
    for (let lvl = 1; lvl < RAMP.length; lvl++) {
      ctx.globalAlpha = 0.12 + 0.88 * Math.pow(lvl / (RAMP.length - 1), 1.2);
      for (let y = 0; y < rows; y++) {
        // load-in: rows decode top to bottom
        const rowP = reveal * 1.35 - (y / rows) * 0.35;
        if (rowP <= 0) continue;
        for (let x = 0; x < cols; x++) {
          const v = grid[y * cols + x];
          if (!v) continue;
          let k = Math.round(v * (RAMP.length - 1));
          let c = RAMP[k];
          const X = ox + x * cw, Y = oy + y * ch;
          if (rowP < 1 && Math.random() > rowP) c = RAMP[1 + ((Math.random() * (RAMP.length - 1)) | 0)];
          if (pointer) {
            const d = Math.hypot(X - pointer.x, Y - pointer.y);
            if (d < R) { c = BITS[(x * 7 + y * 13 + ((t / 90) | 0)) & 1]; k = Math.min(RAMP.length - 1, k + 3); }
          }
          if (k !== lvl) continue;
          ctx.fillText(c, X, Y);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    raf = 0;
    if (reveal < 1) { reveal = Math.min(1, (now - revealStart) / 1400); }
    draw();
    if (reveal < 1 || pointer) raf = requestAnimationFrame(loop);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };

  // start the decode when the card scrolls into view
  function start() {
    if (reduce) return draw();
    new IntersectionObserver((es, io) => {
      if (es[0].isIntersecting) { revealStart = performance.now(); kick(); io.disconnect(); }
    }, { threshold: 0.35 }).observe(card);
  }

  if (!reduce) {
    stage.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      const r = stage.getBoundingClientRect();
      pointer = { x: e.clientX - r.left, y: e.clientY - r.top }; kick();
    });
    stage.addEventListener('pointerleave', () => { pointer = null; kick(); });
  }

  // compare slider
  function setSplit(pct) {
    pct = Math.max(0, Math.min(100, pct));
    const cr = card.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    // handle is positioned on the card, the clip on the stage; keep both in sync
    const xCard = sr.left - cr.left + sr.width * pct / 100;
    card.style.setProperty('--split', (xCard / cr.width * 100) + '%');
    stage.style.setProperty('--split', pct + '%');
    handle.setAttribute('aria-valuenow', Math.round(pct));
    handle.dataset.pct = pct;
  }
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    const move = ev => { const r = stage.getBoundingClientRect(); setSplit((ev.clientX - r.left) / r.width * 100); };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  handle.addEventListener('keydown', e => {
    const cur = +handle.dataset.pct;
    const step = e.shiftKey ? 20 : 5;
    if (e.key === 'ArrowLeft') { setSplit(cur - step); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setSplit(cur + step); e.preventDefault(); }
    if (e.key === 'Home') { setSplit(0); e.preventDefault(); }
    if (e.key === 'End') { setSplit(100); e.preventDefault(); }
  });

  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { build(); setSplit(+handle.dataset.pct); }, 120); });

  img = new Image();
  img.onload = async () => {
    try { await document.fonts.load(`500 8px "JetBrains Mono"`); } catch (e) {}
    build(); setSplit(100); start();
  };
  img.src = SRC;
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · Flip portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style>
  :root{ --bg:#fbfaf8; --card:#0b0b0c; --ghost:rgba(255,255,255,.07); --mark:#48484b; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:48px 16px;background:var(--bg);font-family:Manrope,sans-serif}

  /* ===== flip portrait card (drop this block into the about page) ===== */
  .flip{position:relative;width:min(440px,100%);aspect-ratio:3/4;perspective:1600px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flip:focus-visible{outline:2px solid #3838eb;outline-offset:6px;border-radius:22px}
  .flip-inner{position:relative;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.16,1,.3,1)}
  .flip.on .flip-inner{transform:rotateY(180deg)}
  .flip:active .flip-inner{scale:.985}
  .face{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card);color:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;isolation:isolate}
  .back{transform:rotateY(180deg)}

  /* shared photo placement: both faces use the same box so the flip reads as one image turning into code */
  /* thin white outline traced around the cut-out (four 0.6px shadows) */
  .shot{position:absolute;right:-10%;bottom:0;height:86%;width:auto;z-index:1;
    filter:saturate(1.08) contrast(1.04) drop-shadow(.6px 0 0 #fff) drop-shadow(-.6px 0 0 #fff) drop-shadow(0 .6px 0 #fff) drop-shadow(0 -.6px 0 #fff)}
  .front::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(120% 90% at 62% 55%,transparent 55%,rgba(0,0,0,.45)),linear-gradient(transparent 70%,rgba(0,0,0,.35))}

  .copy{position:absolute;left:8%;top:7%;z-index:4;max-width:46%}
  .copy .tag{margin:0 0 6px;font-weight:500;font-size:clamp(22px,6vw,28px);letter-spacing:-.02em;line-height:1.3}
  .copy .lead{margin:0 0 6px;font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.3}
  .copy .sub{margin:0;font-size:14px;line-height:1.5;color:rgba(255,255,255,.78)}

  /* flowing wave lines behind the photo (paths drawn by the script below) */
  .waves{position:absolute;inset:0;z-index:0;width:100%;height:100%;pointer-events:none}
  .waves path{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1}

  .back canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block}
  .ghost{position:absolute;left:8%;bottom:6%;z-index:0;margin:0;font-weight:700;font-size:clamp(16px,4.6vw,22px);line-height:1.3;color:var(--ghost);white-space:pre;pointer-events:none;user-select:none}

  /* round handle that sits on the card edge, like the reference */
  .knob{position:absolute;right:-20px;top:50%;z-index:5;width:40px;height:40px;margin-top:-20px;border-radius:50%;background:#f4f3ef;color:#2f2f2f;
    display:grid;place-items:center;font-size:17px;box-shadow:0 4px 18px rgba(0,0,0,.28);transition:transform .5s cubic-bezier(.16,1,.3,1);pointer-events:none}
  .flip:hover .knob{transform:scale(1.08)}
  .flip.on .knob{transform:rotate(180deg)}

  /* ?export=front|back renders one flat face for saving as an image */
  html.export,html.export body{background:transparent}
  html.export body{display:block;min-height:0;padding:0}
  html.export .flip{position:fixed;left:0;top:0;width:440px;perspective:none}
  html.export .flip-inner,html.export .knob{transition:none}
  html.export .knob{display:none}

  @media (max-width:520px){
    .knob{right:12px;top:auto;bottom:14px;margin:0}
    .copy{max-width:50%}
  }
  @media (prefers-reduced-motion:reduce){
    .flip-inner,.knob{transition:none}
    .flip.on .flip-inner{transform:none}
    .back{transform:none;opacity:0;transition:opacity .2s}
    .flip.on .back{opacity:1}
  }
</style>
</head>
<body>

<div class="flip" role="button" tabindex="0" aria-pressed="false" aria-label="Portrait card. Press to switch between the photo and the code version">
  <div class="flip-inner">

    <!-- FRONT: color photo -->
    <div class="face front">
      <svg class="waves" viewBox="0 0 440 587" preserveAspectRatio="none" aria-hidden="true"></svg>
      <img class="shot" src="img/about/portrait-fort-crop.png" alt="Siddhesha smiling">
      <div class="copy">
        <p class="tag">EXPERIENCE</p>
        <p class="lead">Designing experiences</p>
        <p class="sub">for humans within systems.</p>
      </div>
    </div>

    <!-- BACK: the same photo as 0101 text -->
    <div class="face back" aria-hidden="true">
      <!-- "Human" in binary -->
      <p class="ghost">01001000
01110101
01101101
01100001
01101110
system.think()
analyze()</p>
      <canvas></canvas>
      <div class="copy">
        <p class="tag">SYSTEMS</p>
        <p class="lead">Trained to think in</p>
        <p class="sub">structure, logic, and complexity.</p>
      </div>
    </div>
  </div>
  <span class="knob" aria-hidden="true"><i class="ph-bold ph-arrows-clockwise"></i></span>
</div>

<script>
(() => {
  // grayscale, contrast-boosted head-and-shoulders crop made from portrait-fort-cut.png
  const SRC = 'img/about/portrait-fort-ascii.png';
  const CROP = { x: 0, y: 0, w: 700, h: 950 };
  const PLACE = { h: 0.86, right: -0.1 };
  const RAMP = ' .:-=+*#';
  const BITS = '01';

  const card = document.querySelector('.flip');
  const back = card.querySelector('.back');
  const cv = back.querySelector('canvas');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const exportSide = new URLSearchParams(location.search).get('export');
  let img, grid = null, cols = 0, rows = 0, cw = 0, ch = 0, ox = 0, oy = 0, dpr = 1, fontPx = 7;
  let reveal = 0, revealStart = 0, pointer = null, raf = 0;

  function build() {
    const W = back.offsetWidth, H = back.offsetHeight;
    dpr = exportSide ? (devicePixelRatio || 1) : Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

    const h = H * PLACE.h, w = h * CROP.w / CROP.h;
    const x = W - w - W * PLACE.right, y = H - h;

    // the image export is high resolution, so it can afford a finer grid
    fontPx = exportSide ? h / 175 : Math.max(4, Math.min(7, h / 125));
    const ctx = cv.getContext('2d');
    ctx.font = `500 ${fontPx}px "JetBrains Mono", ui-monospace, monospace`;
    cw = ctx.measureText('M').width; ch = fontPx * 1.02;
    cols = Math.floor(w / cw); rows = Math.floor(h / ch);
    ox = x + (w - cols * cw) / 2; oy = y + (h - rows * ch);

    // one sample per character cell
    const s = document.createElement('canvas'); s.width = cols; s.height = rows;
    const sx = s.getContext('2d', { willReadFrequently: true });
    sx.imageSmoothingQuality = 'high';
    sx.drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, 0, 0, cols, rows);
    const px = sx.getImageData(0, 0, cols, rows).data;
    const lum = new Float32Array(cols * rows);
    for (let i = 0; i < lum.length; i++) lum[i] = (0.2126 * px[i*4] + 0.7152 * px[i*4+1] + 0.0722 * px[i*4+2]) / 255;

    // contrast stretch on the subject only (the backdrop is pure black)
    const fg = Array.from(lum).filter(v => v > 0.04).sort((a, b) => a - b);
    const lo = fg[Math.floor(fg.length * 0.03)] || 0, hi = fg[Math.floor(fg.length * 0.985)] || 1;
    const at = (xx, yy) => lum[Math.min(rows-1, Math.max(0, yy)) * cols + Math.min(cols-1, Math.max(0, xx))];

    grid = new Float32Array(cols * rows);
    for (let yy = 0; yy < rows; yy++) for (let xx = 0; xx < cols; xx++) {
      const i = yy * cols + xx, v = lum[i];
      if (v < 0.035) { grid[i] = 0; continue; }
      const gx = at(xx+1,yy) - at(xx-1,yy), gy = at(xx,yy+1) - at(xx,yy-1);
      let n = (v - lo) / (hi - lo);
      n = Math.pow(Math.min(1, Math.max(0, n)), exportSide ? 1.35 : 0.95) + Math.hypot(gx, gy) * 0.15;
      grid[i] = Math.min(1, Math.max(0.08, n));
    }
    draw();
  }

  function draw() {
    if (!grid) return;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.font = `500 ${fontPx}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#ecebe6';
    const t = performance.now(), R = 56, L = RAMP.length - 1;

    for (let lvl = 1; lvl <= L; lvl++) {
      ctx.globalAlpha = 0.1 + 0.9 * Math.pow(lvl / L, exportSide ? 1.9 : 1.2);
      for (let y = 0; y < rows; y++) {
        const rowP = reveal * 1.35 - (y / rows) * 0.35;   // rows settle top to bottom
        if (rowP <= 0) continue;
        for (let x = 0; x < cols; x++) {
          const v = grid[y * cols + x];
          if (!v) continue;
          let k = Math.round(v * L), c = RAMP[k];
          const X = ox + x * cw, Y = oy + y * ch;
          if (rowP < 1 && Math.random() > rowP) c = BITS[(Math.random() * 2) | 0];
          if (pointer && Math.hypot(X - pointer.x, Y - pointer.y) < R) {
            c = BITS[(x * 7 + y * 13 + ((t / 90) | 0)) & 1]; k = Math.min(L, k + 3);
          }
          if (k !== lvl) continue;
          ctx.fillText(c, X, Y);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function loop(now) {
    raf = 0;
    if (reveal < 1) reveal = Math.max(0, Math.min(1, (now - revealStart) / 1300));
    draw();
    if (reveal < 1 || pointer) raf = requestAnimationFrame(loop);
  }
  const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };

  function toggle() {
    const on = card.classList.toggle('on');
    card.setAttribute('aria-pressed', on);
    if (on) {
      // decode the characters while the card turns
      if (reduce) { reveal = 1; draw(); }
      else { reveal = 0; revealStart = performance.now() + 220; draw(); kick(); }
    }
  }
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  if (!reduce) {
    back.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || !card.classList.contains('on')) return;
      const r = back.getBoundingClientRect();
      // the back face is mirrored by the flip, so measure from the right edge
      pointer = { x: r.right - e.clientX, y: e.clientY - r.top };
      pointer.x = back.offsetWidth - pointer.x;
      kick();
    });
    back.addEventListener('pointerleave', () => { pointer = null; kick(); });
  }

  let rz;
  addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(build, 120); });

  // wave lines: stacked sine curves that drift in phase, like contour lines
  (() => {
    const svg = document.querySelector('.waves');
    let d = '';
    for (let i = 0; i < 22; i++) {
      const base = -40 + i * 30, amp = 16 + 10 * Math.sin(i * 0.45), ph = i * 0.32;
      let p = '';
      for (let x = -10; x <= 450; x += 6) {
        const y = base + amp * Math.sin(x / 70 + ph) + 0.12 * x;
        p += (x === -10 ? 'M' : 'L') + x + ' ' + y.toFixed(1) + ' ';
      }
      d += `<path d="${p}"/>`;
    }
    svg.innerHTML = d;
  })();

  if (exportSide) {
    document.documentElement.classList.add('export');
    if (exportSide === 'back') card.classList.add('on');
  }

  img = new Image();
  img.onload = async () => {
    try { await document.fonts.load('500 8px "JetBrains Mono"'); await document.fonts.ready; } catch (e) {}
    reveal = 1; build();
  };
  img.src = SRC;
})();
</script>
</body>
</html>
